function empty(title,desc){return `<div class="empty">${icon('book')}<div>${title}</div><p>${desc}</p></div>`}
function detail(){const r=state.records.find(r=>r.id===activeId);if(!r)return empty('未找到这条资料','请返回资料库，或稍后重试。')+`<button data-nav="library">返回资料库</button>`;const d=duplicateCandidates(r);return `<a class="back" href="#/" data-nav="library">← 返回研究资料库</a><div class="detail-grid"><article class="panel detail-header"><div class="card-meta"><span class="badge gray">${esc(r.type)}</span><span class="badge ${isVerified(r)?'':'amber'}">${esc(r.status)}</span><span class="badge blue">证据：${esc(r.strength)}</span></div><h1>${esc(r.title)}</h1><div class="detail-original">${esc(r.subtitle)}</div><p class="detail-authors">${esc(r.authors)}</p><div class="detail-metadata"><div><small>发表时间 / 来源</small>${esc(r.date)} · ${esc(r.source)}</div><div><small>适用年龄段</small>${esc(r.ages.join('、')||'待核验')}</div><div><small>原文 / 官方来源</small><a href="${href(r.url)}" target="_blank" rel="noopener noreferrer">访问一手来源 ${icon('external')}</a></div><div><small>DOI / 标识</small>${esc(r.doi||'无 DOI / 见原文标识')}</div></div><div class="split-actions"><button class="small ${r.reading?'primary':''}" data-bookmark="${r.id}">${icon('bookmark')}${r.reading?'已在阅读清单':'加入阅读清单'}</button><button class="small" data-edit="${r.id}">${icon('edit')} 编辑与核验</button><button class="small" data-apply="${r.id}">${icon('flask')} 记录应用</button></div>${detailSection('核心发现',r.findings,'book')}${detailSection('证据优势',r.advantages,'check')}${detailSection('适用范围与方法问题',r.limits,'info')}${detailSection('用于“奇妙博物馆进校园”',r.advice,'flask','advice')}${detailSection('出处定位',r.location,'link','location')}${detailSection('阅读笔记',r.notes||'还没有阅读笔记。点击“编辑与核验”添加。','edit')}</article><aside class="detail-side"><div class="aside-panel"><h3 class="aside-title">${icon('check')} 核验进度</h3><div class="badge ${isVerified(r)?'':'amber'}">${esc(r.status)}</div><p>最近核验：${esc(r.checkedAt||'尚未核验')}<br>版本：v${r.revision||1}</p><div class="aside-rule"><div class="eyebrow">下一步</div><p>${esc(r.pending||'当前没有待核验事项。')}</p></div><button class="small" data-edit="${r.id}">更新核验记录</button></div><div class="aside-panel"><h3 class="aside-title">${icon('link')} 重复检查</h3><p>自动比较 DOI、来源链接与规范化原题，并提示相近题名。</p>${d.length?d.map(x=>`<div class="dup"><a data-record="${x.id}" href="#/research/${x.id}">${esc(x.title)}</a><br>${esc(x.match)}</div>`).join(''):'<span class="badge">未发现书目重复候选</span>'}<p>同一数据集的多篇论文需人工确认。</p>${r.id==='critical-2014'?'<div class="dup">人工待查：2016年 Measuring Critical Thinking 可能使用同一参访项目数据。</div>':''}</div><div class="aside-panel"><h3 class="aside-title">${icon('history')} 条目版本</h3>${state.events.filter(e=>e.record_id===r.id&&e.after).slice(0,5).map(e=>`<div class="mini-item"><a data-snapshot="${e.id}" href="#">v${e.revision} · ${esc(e.type)}</a><small>${esc(e.created_at.slice(0,10))}</small></div>`).join('')||'<p>v1 · 初始资料<br>2026-11-10 建立</p>'}</div></aside></div>`}
function detailSection(title,text,i,cls=''){return `<section class="detail-section ${cls}"><h3>${icon(i)}${title}</h3><p>${esc(text||'待补充')}</p></section>`}
function duplicateCandidates(r){const n=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');const words=s=>new Set((s||'').toLowerCase().match(/[a-z]{4,}/g)||[]);return state.records.filter(x=>x.id!==r.id).map(x=>{let match='';if(r.doi&&n(r.doi)===n(x.doi))match='相同 DOI';else if(r.url.split('?')[0]===x.url.split('?')[0])match='相同来源链接';else if(n(r.subtitle||r.title)===n(x.subtitle||x.title))match='相同题名';else{const a=words(r.subtitle),b=words(x.subtitle),intersection=[...a].filter(v=>b.has(v)).length;if(a.size&&b.size&&intersection/(a.size+b.size-intersection)>.6)match='原题相似，请人工确认'}return {...x,match}}).filter(x=>x.match)}
function customTasks(){const done=new Set(state.events.filter(e=>e.type==='完成核验事项').map(e=>e.taskId));return state.events.filter(e=>e.type==='待核验事项'&&!done.has(e.id))}
function verify(){const records=state.records.filter(r=>r.pending);return `${heading('待核验事项','把不确定的问题写清楚，再回到一手资料逐项核对。','task')}<div class="info-strip">${icon('info')} 核验重点：作者与题名、发表时间、研究对象、样本与方法、结论对应的段落或表格，以及同一数据集的重复发表。</div><div class="section-title"><h2>待处理 <small>${records.length+customTasks().length} 项</small></h2></div>${customTasks().map(t=>`<article class="task-row"><span class="badge amber">手动添加</span><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p><div class="row-bottom"><span>${esc(t.created_at.slice(0,10))}</span><button class="small" data-resolve="${t.id}">${icon('check')} 标为完成</button></div></article>`).join('')}${records.map(r=>`<article class="task-row"><span class="badge amber">${esc(r.status)}</span><h3><a data-record="${r.id}" href="#/research/${r.id}">${esc(r.title)}</a></h3><p>${esc(r.pending)}</p><div class="row-bottom"><span>出处：${esc(r.source)}</span><button class="small" data-edit="${r.id}">${icon('edit')} 处理核验</button></div></article>`).join('')}${!records.length&&!customTasks().length?empty('当前事项已处理','新资料加入时，请及时记录需要核验的问题。'):''}`}
function applications(){const logs=state.events.filter(e=>e.type==='应用记录');return `${heading('课程应用','将研究发现转化为课程动作，记录实施、观察与下一次调整。','application')}<div class="info-strip">${icon('flask')} 应用记录关联具体资料、课程与年龄段。初始建议均为待实践建议；保存实际应用记录后，资料才会标为“已应用”。</div>${logs.length?logs.map(e=>`<article class="application-row"><span class="badge">${esc(e.age||'年龄待补')}</span><span class="badge gray">${esc(e.date)}</span><h3>${esc(e.course)}</h3><p>${esc(e.description)}</p><div class="detail-section"><h3>观察与后续调整</h3><p>${esc(e.outcome)}</p></div><div class="row-bottom"><a class="record-link" href="#/research/${e.record_id}" data-record="${e.record_id}">关联资料：${esc(e.title)}</a></div></article>`).join(''):empty('第一条课程应用，等待你来记录','可从拓印、黏土、文物观察或图册任务开始。')}<div class="panel"><h2>课程转化的三个关注点</h2><div class="detail-metadata" style="margin:0"><div><small>6–8岁 / 一二年级</small>图像与实物观察，口述发现，简短操作。</div><div><small>8–10岁 / 三四年级</small>比较器物用途，解释操作与知识的联系。</div><div><small>10–12岁 / 五六年级</small>提出判断与证据，讨论保护，完成迁移任务。</div><div><small>评价记录</small>同步保存年级、人数、课时、作品解释与知识表现。</div></div><p class="aside-note">以上为工作台的课程设计提示，需结合本地学生情况试用与调整。</p></div>`}
function history(){const events=state.events;return `${heading('版本历史','每一次修改都留下记录，让研究判断与课程转化可追溯。')}<div class="section-title"><h2>更新记录 <small>${events.length} 条 · 最近300条</small></h2></div>${events.map(e=>`<article class="history-row"><div class="card-meta"><span class="badge ${e.type==='应用记录'?'':'gray'}">${esc(e.type)}</span><span class="date">${esc(e.created_at.replace('T',' ').slice(0,16))} UTC</span></div><h3>${esc(e.title||e.summary||e.mode||'工作台更新')}</h3>${e.text?`<p>${esc(e.text)}</p>`:''}${e.summary?`<p>${esc(e.summary)}</p>`:''}${e.type==='检索更新'?`<p>新增 ${e.added} 条；跳过重复 ${e.skipped} 条。${esc((e.failures||[]).join('；'))}</p>`:''}<div class="row-bottom"><span>${e.revision?'资料版本 v'+e.revision:''}</span><div class="split-actions">${e.record_id?`<a class="record-link" href="#/research/${e.record_id}" data-record="${e.record_id}">查看资料</a>`:''}${e.after?`<button class="small" data-snapshot="${e.id}">查看快照</button>`:''}</div></div></article>`).join('')||empty('版本历史已就绪','初始8条资料为v1；后续编辑、核验、检索与应用都会记录在这里。')}`}
function openDialog(title,body,footer){document.getElementById('modal').innerHTML=`<dialog aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="text-btn" data-action="close" aria-label="关闭">${icon('close')}</button></div><div class="dialog-body">${body}<div class="form-error" id="form-error" role="alert"></div></div><div class="dialog-footer"><button data-action="close">取消</button>${footer||''}</div></dialog>`;document.querySelector('dialog').showModal()}
function closeDialog(){const d=document.querySelector('dialog');if(d)d.close();document.getElementById('modal').innerHTML=''}
function field(label,key,value='',textarea=false,wide=false,required=false){return `<label class="field ${wide?'wide':''}">${label}${required?' *':''}${textarea?`<textarea name="${key}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${key}" value="${esc(value)}" ${required?'required':''} ${key==='url'?'type="url"':key==='date'?'placeholder="YYYY-MM-DD"':''}>`}</label>`}
function sel(label,key,opts,value){return `<label class="field">${label}<select name="${key}">${opts.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function edit(id){const r=state.records.find(r=>r.id===id)||{id:crypto.randomUUID(),title:'',subtitle:'',authors:'',source:'',url:'',doi:'',date:'',ages:[],topics:[],type:'待分类',strength:'待评估',status:'待核验',findings:'',advantages:'',limits:'',advice:'',location:'',pending:'核对作者、发表时间、研究方法与结论出处。',reading:false,applied:false,notes:'',checkedAt:''};window.editing=r;
openDialog(id?'编辑资料与核验':'添加研究资料',`<form id="record-form"><div class="form-grid">${field('中文题目 / 展示题目','title',r.title,false,true,true)}${field('原文题名','subtitle',r.subtitle,false,true)}${field('完整作者 / 发布机构','authors',r.authors,false,true,true)}${field('来源 / 期刊卷期页码','source',r.source)}${field('发表时间','date',r.date)}${field('一手来源链接','url',r.url,false,true,true)}${field('DOI','doi',r.doi)}${field('最近核验时间','checkedAt',r.checkedAt)}<div class="field wide">年龄段（按研究对象或适用范围选择）<div class="checks">${ages.map(a=>`<label><input type="checkbox" name="ages" value="${a}" ${r.ages.includes(a)?'checked':''}>${a}</label>`).join('')}</div></div><div class="field wide">教学主题<div class="checks">${topics.map(a=>`<label><input type="checkbox" name="topics" value="${a}" ${r.topics.includes(a)?'checked':''}>${a}</label>`).join('')}</div></div>${sel('研究类型','type',types,r.type)}${sel('证据强度（人工审读）','strength',strengths,r.strength)}${sel('核验状态','status',statuses,r.status)}${field('修改说明','reason','补充资料与核验记录')}${field('核心发现','findings',r.findings,true,true)}${field('证据优势','advantages',r.advantages,true)}${field('适用范围与方法问题','limits',r.limits,true)}${field('课程与图册实践建议（注明转化建议）','advice',r.advice,true,true)}${field('出处定位（作者题名 + 章节 / 页码 / 表格）','location',r.location,true,true)}${field('待核验事项（完成后清空）','pending',r.pending,true,true)}${field('阅读笔记','notes',r.notes,true,true)}</div></form>`,`<button class="primary" data-action="save-record">${icon('check')} 保存资料</button>`)}
function application(id){const r=state.records.find(r=>r.id===id);openDialog('记录课程应用',`<form id="application-form"><div class="form-grid"><label class="field wide">关联研究资料 *<select name="recordId" required>${state.records.map(x=>`<option value="${x.id}" ${r?.id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label>${field('课程 / 图册具体页面','course','',false,true,true)}${sel('年龄段','age',ages,ages[1])}${field('实施日期','date',now())}${field('如何使用了研究建议','description','',true,true,true)}${field('观察到的表现、证据与后续调整','outcome','',true,true)}</div></form>`,`<button class="primary" data-action="save-application">保存应用记录</button>`)}
function exportDialog(){const n=filtered().length;openDialog('导出带注释的阅读清单',`<p class="rubric">包含完整题名、作者、来源链接、发表时间、研究结论、证据评价、实践建议、出处定位、核验状态与阅读笔记。</p><form id="export-form"><div class="form-grid">${sel('导出范围','scope',['当前筛选结果（'+n+'条）','我的阅读清单','全部资料'],'当前筛选结果（'+n+'条）')}${sel('文件格式','format',['Markdown (.md)','HTML (.html)'],'Markdown (.md)')}</div></form>`,`<button class="primary" data-action="download">${icon('export')} 导出文件</button>`)}
function markdown(rows){return `# 博物馆教育研究 · Annotated Reading List\n\n导出时间：${now()}\n项目：奇妙博物馆进校园\n共${rows.length}条；证据强度为工作台审读判断，核验范围见各条状态。\n\n`+rows.map((r,i)=>`## ${i+1}. ${r.title}\n\n${r.subtitle}\n\n- 作者：${r.authors}\n- 发表时间：${r.date}\n- 来源：${r.source}\n- 原文链接：${r.url}\n- DOI：${r.doi||'无'}\n- 年龄段：${r.ages.join('、')||'待核验'}\n- 主题：${r.topics.join('、')||'待分类'}\n- 研究类型 / 证据强度：${r.type} / ${r.strength}\n- 核验状态：${r.status}；最近核验：${r.checkedAt||'未核验'}\n- 应用状态：${r.applied?'已应用':'未应用'}\n\n**核心发现**\n\n${r.findings}\n\n**证据优势**\n\n${r.advantages}\n\n**适用范围与方法问题**\n\n${r.limits}\n\n**课程与图册实践建议（项目转化建议）**\n\n${r.advice}\n\n**出处定位**\n\n${r.location}\n\n**待核验事项**\n\n${r.pending||'无'}\n\n**阅读笔记**\n\n${r.notes||'无'}\n\n**重复检查**\n\n${duplicateCandidates(r).map(x=>x.title+'：'+x.match).join('；')||'未发现书目重复候选；同一数据集另行人工核对。'}\n\n---\n`).join('\n')}
function download(){const f=new FormData(document.getElementById('export-form')),scope=f.get('scope');const rows=scope==='全部资料'?state.records:scope==='我的阅读清单'?state.records.filter(r=>r.reading):filtered();if(!rows.length){document.getElementById('form-error').textContent='当前范围没有资料，请选择其他范围。';return}const html=f.get('format').startsWith('HTML');let data=markdown(rows);if(html)data=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Annotated Reading List</title><style>body{font:15px/1.9 sans-serif;max-width:900px;margin:50px auto;padding:20px;color:#334b3d}h1,h2{font-family:serif}article{border-top:1px solid #ddd;margin-top:30px}a{color:#315f4a}p{white-space:pre-wrap}small{color:#899780}@media print{article{break-inside:avoid}}</style><h1>博物馆教育研究</h1><p>Annotated Reading List · ${now()} · ${rows.length}条</p>${rows.map(r=>`<article><h2>${esc(r.title)}</h2><p>${esc(r.subtitle)}</p><p>${esc(r.authors)} · ${esc(r.date)}<br>${esc(r.source)}<br><a href="${href(r.url)}">${esc(r.url)}</a><br>DOI：${esc(r.doi||'无')}<br>核验：${esc(r.status)} · ${esc(r.checkedAt)}<br>证据：${esc(r.strength)} · ${esc(r.type)}<br>年龄：${esc(r.ages.join('、'))}<br>主题：${esc(r.topics.join('、'))}<br>应用：${r.applied?'已应用':'未应用'}</p>${[['核心发现',r.findings],['证据优势',r.advantages],['适用范围与方法问题',r.limits],['实践建议（项目转化）',r.advice],['出处定位',r.location],['待核验事项',r.pending||'无'],['笔记',r.notes||'无'],['重复检查',duplicateCandidates(r).map(x=>x.title+'：'+x.match).join('；')||'未发现书目重复候选；同一数据集需人工核对。']].map(([l,v])=>`<h3>${l}</h3><p>${esc(v)}</p>`).join('')}</article>`).join('')}</html>`;const blob=new Blob(['\ufeff'+data],{type:html?'text/html;charset=utf-8':'text/markdown;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Museum_Education_Annotated_Reading_List_'+now()+(html?'.html':'.md');a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);closeDialog();toast('已导出 '+rows.length+' 条带来源链接的注释书目')}
function rubric(){openDialog('如何判断证据强度',`<div class="rubric"><div><b>较强</b>：可信的随机对照设计，仍需检查分配、流失、测量与适用对象。</div><div><b>中等</b>：有对照或混合方法，但样本、分配或干预设计存在约束。</div><div><b>初步</b>：个案、观察或自报，适合形成问题与实践启发。</div><div><b>框架参考</b>：政策、指南与评价工具，用于规划与组织证据。</div><div><b>待评估</b>：尚未充分阅读方法与结果。</div><hr><p>核验状态与证据强度分开管理。已核验全文表示已核对正文，并不表示所有方法问题已解决。最新发表不自动意味着更强证据；课程建议为项目转化建议。</p></div>`,`<button class="primary" data-action="close">了解</button>`)}
function snapshot(id){const e=state.events.find(e=>e.id===id);if(!e?.after)return;window.snapshotEvent=e;openDialog('资料版本快照 · v'+e.revision,`<div class="rubric"><b>${esc(e.title)}</b><p>${esc(e.created_at)}</p><p>核验状态：${esc(e.after.status)}<br>出处定位：${esc(e.after.location)}</p><h3>核心发现</h3><p>${esc(e.after.findings)}</p><h3>实践建议</h3><p>${esc(e.after.advice)}</p><h3>阅读笔记</h3><p>${esc(e.after.notes||'无')}</p><details><summary>完整快照</summary><pre style="white-space:pre-wrap;word-break:break-all;font-size:10px">${esc(JSON.stringify(e.after,null,2))}</pre></details><p>恢复会创建新版本，保留已有历史；已应用状态根据实际应用记录保留。</p></div>`,`<button class="primary" data-action="restore">恢复这个版本</button>`)}
function navigate(next,id=''){activeId=id;if(next)view=next;historyPush(id?'/research/'+encodeURIComponent(id):'/');render();window.scrollTo({top:0})}
function historyPush(path){window.history.pushState({view},'',path==='/' ? '#/' : '#'+path)}
window.addEventListener('popstate',e=>{activeId=decodeURIComponent(location.hash.split('/research/')[1]||'');view=e.state?.view||'overview';render()});
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;q=e.target.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(start,start)}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;render()}if(e.target.id==='sort'){sort=e.target.value;render()}});
document.addEventListener('click',async e=>{const el=e.target.closest('button,a');if(!el)return;const d=el.dataset;if(d.nav){e.preventDefault();navigate(d.nav);return}if(d.home!==undefined){e.preventDefault();navigate('overview');return}if(d.record){e.preventDefault();navigate('',d.record);return}if(d.tab){tab=d.tab;render();return}if(d.edit){edit(d.edit);return}if(d.apply){application(d.apply);return}if(d.snapshot){e.preventDefault();snapshot(d.snapshot);return}try{
 if(d.bookmark){el.disabled=true;const r=state.records.find(x=>x.id===d.bookmark);await save({...r,reading:!r.reading},r.reading?'移出阅读清单':'加入阅读清单');toast(r.reading?'已移出阅读清单':'已加入阅读清单');return}
 if(d.resolve){await api('/api/workspace',{action:'resolve',taskId:d.resolve,text:'已完成手动核验事项'});await load();toast('已完成核验事项');return}
 switch(d.action){case 'reload':await load();break;case 'close':closeDialog();break;case 'new':edit();break;case 'filter':filtersOpen=!filtersOpen;render();break;case 'reset':q='';filters={};tab='all';render();break;case 'rubric':rubric();break;case 'application':application();break;case 'export':exportDialog();break;case 'download':download();break;case 'task':openDialog('添加待核验事项',`<form id="task-form"><div class="form-grid">${field('核验主题','title','',false,true,true)}${field('具体问题、资料定位与下一步','text','',true,true,true)}</div></form>`,`<button class="primary" data-action="save-task">保存事项</button>`);break;
 case 'save-task':{const f=document.getElementById('task-form');if(!f.reportValidity())break;await api('/api/workspace',{action:'task',...Object.fromEntries(new FormData(f))});closeDialog();await load();toast('已添加待核验事项');break}
 case 'save-record':{const f=document.getElementById('record-form');if(!f.reportValidity())break;el.disabled=true;const fd=new FormData(f),fields=Object.fromEntries(fd);delete fields.reason;const r={...window.editing,...fields,ages:fd.getAll('ages'),topics:fd.getAll('topics')};if(r.status.startsWith('已核验')&&!r.location.trim())throw Error('标为已核验前，请补充出处定位。');if(r.status.startsWith('已核验')&&!r.checkedAt)r.checkedAt=now();const dup=duplicateCandidates(r).filter(x=>x.match!=='原题相似，请人工确认');if(dup.length)throw Error('发现重复资料：'+dup.map(x=>x.title).join('；')+'。请更新已有条目。');await save(r,fd.get('reason')||'更新资料');closeDialog();toast('已保存本机草稿；公开需提交GitHub');break}
 case 'save-application':{const f=document.getElementById('application-form');if(!f.reportValidity())break;el.disabled=true;await api('/api/workspace',{action:'application',...Object.fromEntries(new FormData(f))});closeDialog();await load();toast('已保存应用草稿；公开需提交GitHub');break}
 case 'restore':{el.disabled=true;const e=window.snapshotEvent,current=state.records.find(r=>r.id===e.record_id);await save({...e.after,revision:current.revision,applied:current.applied},'恢复快照 v'+e.revision);closeDialog();toast('已恢复为新版本，历史记录已保留');break}
 case 'discover':{await pagesApi('/api/discover',{});break}
 }
 }catch(err){el.disabled=false;const f=document.getElementById('form-error');if(f)f.textContent=err.message;else toast(err.message)}});
load();
</script></body></html>
